spring.application.name=attendance-service
server.port=${SERVER_PORT:8082}
spring.banner.location=classpath:banner.txt

server.forward-headers-strategy=framework
spring.main.allow-bean-definition-overriding=true

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/attendance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

security.jwt.secret=${SECURITY_JWT_SECRET:+i38C96CqmxwIheqUXRKPHpO/07bWCgLE2SnYJgOQl4=}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:900000}

services.user-service.base-url=${USER_SERVICE_BASE_URL:http://user-service:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===================== Kafka (producer) =====================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ?????: ?? ?? ?????? type headers ? Kafka ?????????
# (????? consumer ?????? ????? default type)
spring.kafka.producer.properties.spring.json.add.type.headers=false

# topic
app.kafka.topics.attendance-events=attendance.events
