spring.application.name=gateway-service
server.port=8080

# ????? ????????? ???????? X-Forwarded-* / Forwarded ????????? (? ???? ??? ???? ??? ? ????????)
server.forward-headers-strategy=framework

# ? ROUTES (????? ??????? ? Spring Cloud 2025: spring.cloud.gateway.server.webflux.*)
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://user-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/internal/**

spring.cloud.gateway.server.webflux.routes[1].id=attendance-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://attendance-service:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/attendance/**

# ? CORS ????????? (????? ????? ? 3000 ?? ?????)
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000,http://172.18.0.1:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
