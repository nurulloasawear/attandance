spring.application.name=user-service

# Server
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework
spring.main.allow-bean-definition-overriding=true

# Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Superadmin (optional seed)
app.superadmin.username=${APP_SUPERADMIN_USERNAME:superadmin}
app.superadmin.email=${APP_SUPERADMIN_EMAIL:superadmin@mail.com}
app.superadmin.password=${APP_SUPERADMIN_PASSWORD:SuperAdmin123}

# Datasource (Postgres in docker network)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/attendance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate: schema managed ONLY by DatabaseInitializer
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Spring SQL init: disabled (we use DatabaseInitializer)
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

# Swagger / OpenAPI
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.timeout=5s

# JWT
security.jwt.secret=${SECURITY_JWT_SECRET:+i38C96CqmxwIheqUXRKPHpO/07bWCgLE2SnYJgOQl4=}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-ms=${SECURITY_JWT_REFRESH_EXPIRATION_MS:604800000}
security.jwt.blacklist-ttl-ms=${SECURITY_JWT_BLACKLIST_TTL_MS:${SECURITY_JWT_EXPIRATION_MS:900000}}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Kafka (inside docker network use kafka:9092)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest

# App topics / groups
app.kafka.topics.attendance-events=attendance.events
app.kafka.groups.attendance-events=user-service-attendance-events
